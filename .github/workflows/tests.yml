name: tests

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql+asyncpg://lab:lab@127.0.0.1:5433/lab
  MINIO_ENDPOINT: 127.0.0.1:9000
  MINIO_ACCESS_KEY: labminio
  MINIO_SECRET_KEY: labminio
  MINIO_SECURE: "false"

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control/requirements.txt
      - name: Start Postgres and MinIO
        run: docker compose up -d --wait postgres minio
      - name: Install control dependencies
        run: pip install -r control/requirements.txt
      - name: Lint
        run: ruff check control agent harness tests scripts sim
      - name: Migrations match the models
        working-directory: control
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest tests -v

  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - working-directory: portal
        run: npm ci && npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEV_AGENTS: "1"
      REGISTRY_URL: 127.0.0.1:5001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Start Postgres, MinIO and the registry
        run: docker compose up -d --wait postgres minio registry
      - name: Install control dependencies
        run: |
          python -m venv control/.venv
          control/.venv/bin/pip install -r control/requirements.txt
      - name: Install portal dependencies
        working-directory: portal
        run: npm ci
      - name: Install the Playwright browser
        working-directory: portal
        run: npx playwright install --with-deps chromium
      - name: Start the dev stack (API, portal, train and build agents)
        env:
          MIRROR_CATALOG_IMAGES: "0"
        run: |
          mkdir -p .dev/logs
          nohup scripts/dev.sh > .dev/dev.log 2>&1 &
      - name: Wait for the stack
        run: |
          for _ in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null \
              && curl -sf -o /dev/null http://127.0.0.1:3000/login \
              && [ -s .dev/agent-train.json ]; then
              echo "stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not come up"
          tail -n 50 .dev/dev.log .dev/logs/*.log || true
          exit 1
      - name: End-to-end tests
        working-directory: portal
        env:
          E2E_JOB_TIMEOUT_MS: "360000"
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            portal/playwright-report
            portal/test-results
          retention-days: 7
      - name: Upload the stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-stack-logs
          path: .dev/logs
          retention-days: 7
