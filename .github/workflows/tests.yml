name: tests

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql+asyncpg://lab:lab@127.0.0.1:5433/lab
  MINIO_ENDPOINT: 127.0.0.1:9000
  MINIO_ACCESS_KEY: labminio
  MINIO_SECRET_KEY: labminio
  MINIO_SECURE: "false"

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control/requirements.txt
      - name: Start Postgres and MinIO
        run: docker compose up -d --wait postgres minio
      - name: Install control dependencies
        run: pip install -r control/requirements.txt
      - name: Lint
        run: ruff check control agent harness tests scripts sim
      - name: Migrations match the models
        working-directory: control
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest tests -v

  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - working-directory: portal
        run: npm ci && npm run build
