# Production stack for the always-on lab server. Run from the repo root:
#
#   cp deploy/prod.env.example deploy/prod.env   # fill in every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/prod.env up -d --build
#
# Only Caddy publishes ports (80/443). Postgres and MinIO stay on the internal
# network; the API, portal, registry and Grafana are reached through HTTPS
# hostnames. Prometheus is internal only (Grafana and the scrape use it).
name: lab-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: lab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 20

  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registrydata:/var/lib/registry

  control:
    build:
      context: ..
      dockerfile: control/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://lab:${POSTGRES_PASSWORD}@postgres:5432/lab
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: lab
      MINIO_SECURE: "false"
      PUBLIC_BASE_URL: https://${API_HOST:?set API_HOST}
      PORTAL_BASE_URL: https://${PORTAL_HOST:?set PORTAL_HOST}
      REGISTRY_URL: ${REGISTRY_HOST:?set REGISTRY_HOST}
      DEV_AUTH: "0"
      DEV_AUTH_ADMIN: "0"
      OIDC_DEV: "0"
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: https://${API_HOST}/auth/callback
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set ADMIN_EMAILS}
      SESSION_SECURE: "1"
      TOKEN_PEPPER: ${TOKEN_PEPPER:?set TOKEN_PEPPER}
      AGENT_SIGNING_KEY_PATH: /data/agent-signing-key.pem
      AGENT_MIN_VERSION: ${AGENT_MIN_VERSION:-}
      AGENT_ROLLOUT_RING: ${AGENT_ROLLOUT_RING:-2}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      LAB_TIMEZONE: ${LAB_TIMEZONE:-UTC}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-lab@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-1}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      LOG_FORMAT: json
    volumes:
      - controldata:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  portal:
    build:
      context: ../portal
    restart: unless-stopped
    environment:
      CONTROL_API: http://control:8080
      SESSION_SECURE: "1"
    depends_on:
      - control

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
    # The config reads the bearer token from a file; write it from the
    # environment first (Prometheus does not expand variables in its config).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics-token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      - control

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:?set GRAFANA_HOST}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
      PORTAL_HOST: ${PORTAL_HOST}
      REGISTRY_HOST: ${REGISTRY_HOST}
      GRAFANA_HOST: ${GRAFANA_HOST:?set GRAFANA_HOST}
      LAB_TLS: ${LAB_TLS:-internal}
      REGISTRY_PUSH_USER: ${REGISTRY_PUSH_USER:?set REGISTRY_PUSH_USER}
      REGISTRY_PUSH_HASH: ${REGISTRY_PUSH_HASH:?set REGISTRY_PUSH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - control
      - portal
      - registry
      - grafana

volumes:
  pgdata:
  miniodata:
  registrydata:
  controldata:
  caddydata:
  prometheusdata:
  grafanadata:
