# Scrapes the control plane over the internal network. The bearer token is
# written to /tmp/metrics-token by the container's start command from
# METRICS_TOKEN (Prometheus does not expand environment variables itself).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: lab-control
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ["control:8080"]
